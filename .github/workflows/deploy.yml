name: Deploy API to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy API to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting API Deployment on VPS..."
            cd /var/www/serverembassy-api

            echo "📥 Pulling latest changes from git..."
            git pull origin main || git pull origin master

            echo "📦 Installing dependencies..."
            npm ci --prefer-offline --no-audit

            echo "🔨 Compiling TypeScript..."
            npm run build

            echo "♻️ Reloading PM2 with zero downtime..."
            pm2 reload serverembassy-api --update-env || pm2 start ecosystem.config.cjs

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "✅ API Deployment completed successfully!"
